name: Release

# Publish to npm when a version tag (v1.2.3) is pushed.
#   npm version patch   # bumps package.json + creates the tag
#   git push --follow-tags
#
# Requires an npm automation token stored as the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate -> "Automation").
#
# Deliberately tag-triggered rather than `release: published` (the family's
# documented default) -- same intentional choice isomorphic-jj makes, kept
# here rather than switched, so it needs to stay a documented deviation
# instead of undocumented drift.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "22"
      gate-commands: |
        npm run typecheck
        npm test
        npm run build
        PKG=$(node -p "require('./package.json').version")
        TAG=${GITHUB_REF_NAME#v}
        if [ "$PKG" != "$TAG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package version $PKG"
          exit 1
        fi
    secrets: inherit
