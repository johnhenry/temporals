name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      # 20 has neither native Temporal nor iterator helpers (polyfill path);
      # 22 has both (native path). Cover both.
      node-versions: '["20", "22"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm run typecheck
        npm test
        npm run build
        npm run test:example
        npm run examples
        npm run docs

  coverage:
    # Kept as its own job rather than folded into the reusable ci.yml call:
    # single pinned Node version with a custom coverage-threshold
    # invocation, not a plain "npm test" gate the reusable workflow's
    # matrix shape covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # coverage threshold flags require Node 22+
          cache: npm
      - run: npm ci
      # Fail the build if coverage drops below 80% on any metric.
      - run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-lines=80
          --test-coverage-branches=80
          --test-coverage-functions=80
          test/*.test.ts
